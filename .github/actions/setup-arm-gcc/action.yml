name: Setup ARM GNU Toolchain
description: Restore or download the pinned ARM GNU bare-metal toolchain without apt
inputs:
  version:
    description: ARM GNU Toolchain release
    required: false
    default: 13.2.rel1
runs:
  using: composite
  steps:
    - name: Resolve toolchain path
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TOOL_CACHE/arm-gnu-toolchain-${{ inputs.version }}"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - name: Restore ARM GNU Toolchain
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.meta.outputs.dir }}
        key: arm-gnu-toolchain-${{ inputs.version }}-x86_64-${{ runner.os }}

    - name: Download verified ARM GNU Toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TOOLCHAIN_DIR: ${{ steps.meta.outputs.dir }}
      run: |
        set -euo pipefail
        archive="arm-gnu-toolchain-${VERSION}-x86_64-arm-none-eabi.tar.xz"
        base="https://developer.arm.com/-/media/Files/downloads/gnu/${VERSION}/binrel"
        work="$RUNNER_TEMP/arm-toolchain-download"
        rm -rf "$work" "$TOOLCHAIN_DIR"
        mkdir -p "$work" "$TOOLCHAIN_DIR"
        curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
          "$base/$archive" -o "$work/$archive"
        curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
          "$base/$archive.sha256asc" -o "$work/$archive.sha256asc"
        (cd "$work" && sha256sum --check "$archive.sha256asc")
        tar -xJf "$work/$archive" -C "$TOOLCHAIN_DIR" --strip-components=1
        rm -rf "$work"

    - name: Activate ARM GNU Toolchain
      shell: bash
      env:
        TOOLCHAIN_DIR: ${{ steps.meta.outputs.dir }}
      run: |
        set -euo pipefail
        echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
        "$TOOLCHAIN_DIR/bin/arm-none-eabi-gcc" --version
