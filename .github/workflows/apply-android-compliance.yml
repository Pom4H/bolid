name: Apply Android compliance migration

on:
  push:
    branches: [agent/android-tz-compliance]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-tz-compliance
          fetch-depth: 0
      - name: Apply deterministic source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_android_compliance.py
          git rm tools/apply_android_compliance.py
          git rm tools/patches/android-compliance.patch
          git rm .github/workflows/apply-android-compliance.yml
          git diff --check
      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TestDPLS
          git commit -m "fix(android): apply BLE API 26 compatibility and runtime guards"
          git push origin HEAD:agent/android-tz-compliance
