name: Apply firmware lint fix

on:
  push:
    branches: ["agent/firmware-lint"]
    paths:
      - ".github/workflows/apply-firmware-lint-fix.yml"

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/firmware-lint
      - name: Move storage reads outside assert
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Firmware/tests/test_server.c")
          text = path.read_text()

          text = text.replace(
              "    dpls_event_t ev;\n",
              "    dpls_event_t ev;\n    bool event_read;\n",
              1,
          )
          old = "    assert(storage_read(&fake, server.next_event_sequence - 1, &ev));\n"
          if text.count(old) != 2:
              raise SystemExit("unexpected storage_read assert count")
          text = text.replace(
              old,
              "    event_read = storage_read(&fake, server.next_event_sequence - 1, &ev);\n"
              "    assert(event_read);\n",
          )
          replacements = {
              "    assert(storage_read(&fake, seq, &ev) && ev.event_type == 14 && ev.parameter == 1);\n":
                  "    event_read = storage_read(&fake, seq, &ev);\n"
                  "    assert(event_read);\n"
                  "    assert(ev.event_type == 14 && ev.parameter == 1);\n",
              "    assert(storage_read(&fake, seq + 1, &ev) && ev.event_type == 8 &&\n"
              "           ev.parameter == DPLS_RETURN_AUTO_ISOLATION);\n":
                  "    event_read = storage_read(&fake, seq + 1, &ev);\n"
                  "    assert(event_read);\n"
                  "    assert(ev.event_type == 8 && ev.parameter == DPLS_RETURN_AUTO_ISOLATION);\n",
              "    assert(storage_read(&fake, seq, &ev) && ev.event_type == 14 && ev.parameter == 0);\n":
                  "    event_read = storage_read(&fake, seq, &ev);\n"
                  "    assert(event_read);\n"
                  "    assert(ev.event_type == 14 && ev.parameter == 0);\n",
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"expected test fragment not found: {before!r}")
              text = text.replace(before, after, 1)

          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Firmware/tests/test_server.c
          git commit -m "Fix cppcheck warnings in firmware tests"
          git push origin HEAD:agent/firmware-lint
