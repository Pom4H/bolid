name: Apply live voltage telemetry

on:
  push:
    branches:
      - release/v1.1.2-rc.1
    paths:
      - tools/apply_live_voltage_release.py
      - .github/workflows/apply-live-voltage.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1.1.2-rc.1
          fetch-depth: 0

      - name: Apply source migration
        run: |
          set -euo pipefail
          python3 tools/apply_live_voltage_release.py
          rm tools/apply_live_voltage_release.py
          rm .github/workflows/apply-live-voltage.yml
          git diff --check

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add real-time multi-voltage telemetry"
          git push origin HEAD:release/v1.1.2-rc.1
