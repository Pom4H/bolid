name: Apply RGB-preserving ADC pinout

on:
  push:
    branches:
      - release/v1.1.3-rc.1
    paths:
      - tools/apply_rgb_preserving_pinout.py
      - .github/workflows/apply-rgb-preserving-pinout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rgb-preserving-pinout
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1.1.3-rc.1
          fetch-depth: 0

      - name: Apply pinout migration
        run: python3 tools/apply_rgb_preserving_pinout.py

      - name: Verify RGB and ADC contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#define DPLS_PIN_PORT1_ADC GPIO_P20' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT2_ADC GPIO_P15' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT_T_ADC GPIO_P24' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_VCAP_ADC GPIO_P23' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_RED GPIO_P07' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_GREEN GPIO_P11' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_BLUE GPIO_P18' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_FACTORY_RESET GPIO_P34' Firmware/phy6252/dpls_board.h
          grep -q 'ADC_CH2N_P24' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'case ADC_CH2:' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_PIN_LED_GREEN, on ? 1 : 0' Firmware/phy6252/dpls_phy6252_app.c
          ! grep -q 'ADC_CH1N_P11' Firmware/phy6252/dpls_phy6252_app.c
          python3 tools/generate_behavior_sim.py --output /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_LED_RED' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_LED_GREEN' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_LED_BLUE' /tmp/test-dpls-behavior-sim.html

      - name: Run portable firmware tests and lint
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          bash tools/lint_firmware.sh

      - name: Commit corrected sources
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_rgb_preserving_pinout.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Firmware/phy6252/dpls_board.h \
                  Firmware/phy6252/dpls_phy6252_app.c \
                  Firmware/README.md \
                  docs/live-voltage-requirements.md \
                  tools/generate_behavior_sim.py \
                  tools/apply_rgb_preserving_pinout.py
          git commit -m 'fix: preserve RGB LED while scanning four ADC channels'
          git push origin HEAD:release/v1.1.3-rc.1
