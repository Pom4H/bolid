name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run every production platform check
        required: false
        default: false
        type: boolean

jobs:
  smoke:
    name: Cheap PR smoke
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.changes.outputs.android }}
      ios: ${{ steps.changes.outputs.ios }}
      firmware: ${{ steps.changes.outputs.firmware }}
      soft_ble: ${{ steps.changes.outputs.soft_ble }}
      release_pr: ${{ steps.changes.outputs.release_pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect changed areas
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.head_ref }}
          FULL_MATRIX: ${{ inputs.full_matrix }}
        run: |
          set -euo pipefail

          release_pr=false
          [[ "$HEAD_REF" == release/* ]] && release_pr=true

          android=false
          ios=false
          firmware=false
          soft_ble=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FULL_MATRIX" == "true" ]]; then
            android=true
            ios=true
            firmware=true
            soft_ble=true
          else
            head="$CURRENT_SHA"
            base=""

            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              head="$PR_HEAD_SHA"
              if [[ "$EVENT_ACTION" == "synchronize" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
                base="$BEFORE_SHA"
              else
                base="$BASE_SHA"
              fi
            elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              base="$BEFORE_SHA"
            fi

            if [[ -z "$base" ]]; then base="${head}^"; fi
            git fetch --no-tags --depth=2 origin "$head" "$base" || git fetch --no-tags origin "$head" "$base"
            git diff --name-only "$base" "$head" > /tmp/changed.txt
            echo "Changed files ($base..$head):"
            cat /tmp/changed.txt

            ci_changed=false
            shared_mobile=false
            android_only=false
            ios_only=false
            soft_ble_only=false

            if grep -qE '^\.github/workflows/ci\.yml' /tmp/changed.txt; then ci_changed=true; fi
            if grep -qE '^(mobile/(wire|runtime)/|mobile/core/(build\.gradle\.kts|src/(commonMain|commonTest)/)|mobile/(build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradle/|gradlew$|interop/))' /tmp/changed.txt; then shared_mobile=true; fi
            if grep -qE '^(mobile/android/|mobile/core/src/(androidMain|androidUnitTest)/)' /tmp/changed.txt; then android_only=true; fi
            if grep -qE '^(mobile/ios/|mobile/core/src/iosMain/)' /tmp/changed.txt; then ios_only=true; fi
            if grep -qE '^(mobile/core/src/jvmMain/|tools/soft_ble_e2e\.sh|tools/session_capture/|firmware/(sim|src|include)/)' /tmp/changed.txt; then soft_ble_only=true; fi

            if [[ "$shared_mobile" == true || "$android_only" == true ]]; then android=true; fi
            if [[ "$shared_mobile" == true || "$ios_only" == true ]]; then ios=true; fi
            if [[ "$shared_mobile" == true || "$soft_ble_only" == true ]]; then soft_ble=true; fi

            if grep -qE '^(firmware/|tools/(coverage_firmware|lint_firmware|build_firmware|fetch_phy6252_sdk|run_host_invariant_gate|check_repo_layout)\.sh|tools/(architecture_guard|test_ci_contract|test_ble_timeout_contract)\.py|\.github/workflows/(firmware-dx|firmverse-flash-harness)\.yml)' /tmp/changed.txt; then
              firmware=true
            fi

            if [[ "$ci_changed" == true ]]; then
              android=true
              ios=true
              firmware=true
              soft_ble=true
            fi
          fi

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "soft_ble=$soft_ble" >> "$GITHUB_OUTPUT"
          echo "release_pr=$release_pr" >> "$GITHUB_OUTPUT"
          printf 'Selected: android=%s ios=%s firmware=%s soft_ble=%s release_pr=%s\n' "$android" "$ios" "$firmware" "$soft_ble" "$release_pr"

      - name: Host invariants + sanitizers
        run: bash tools/run_host_invariant_gate.sh

      - name: Verify revision 2 pinout contract
        run: |
          grep -q 'DPLS_BOARD_ASSERT(factory_reset_p34' firmware/phy6252/dpls_board.h
          grep -q 'ADC_BIT(DPLS_ADC_CHANNEL(DPLS_PIN_PORT1_ADC))' firmware/phy6252/dpls_phy6252_measurements.c
          grep -q 'ADC_BIT(DPLS_ADC_CHANNEL(DPLS_PIN_VCAP_ADC))' firmware/phy6252/dpls_phy6252_measurements.c
          ! grep -q 'ADC_CH1N_P11' firmware/phy6252/dpls_board.h firmware/phy6252/dpls_phy6252_measurements.c
          grep -q 'DPLS_ADC_NEED_ALL' firmware/phy6252/dpls_phy6252_measurements.c
          grep -q 'hal.hardware.port2_voltage_mv = dpls_phy6252_measurements_port2_mv' firmware/phy6252/dpls_phy6252_runtime.c
          grep -q 'hal.hardware.port_t_voltage_mv = dpls_phy6252_measurements_port_t_mv' firmware/phy6252/dpls_phy6252_runtime.c
          grep -q 'DPLS_STATE_PORT_2_VALID' firmware/phy6252/dpls_phy6252_measurements.c
          grep -q 'DPLS_STATE_PORT_T_VALID' firmware/phy6252/dpls_phy6252_measurements.c
          grep -q 'DANGEROUS_STATE_REFRESH_MS = 1_000L' mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsClient.kt
          grep -q 'NORMAL_STATE_REFRESH_MS = 5_000L' mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsClient.kt
          grep -q 'RSSI_SESSION_POLL_MS = 10_000L' mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsClient.kt
          grep -q 'port2VoltageValid' mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/domain/DeviceModel.kt
          test -f docs/live-voltage-requirements.md

  android:
    name: Android unit tests
    needs: smoke
    if: needs.smoke.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Shared runtime/core tests
        working-directory: mobile
        run: ./gradlew :wire:testDebugUnitTest :runtime:testDebugUnitTest :core:testDebugUnitTest
      - name: Full Android lint + APK
        working-directory: mobile
        run: ./gradlew :wire:lintDebug :runtime:lintDebug :core:lintDebug :android:lintDebug :android:assembleDebug
      - name: Stage installable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/android
          cp mobile/android/build/outputs/apk/debug/android-debug.apk tmp/android/TestDPLS-1.4.2-rc9-debug.apk
          sha256sum tmp/android/TestDPLS-1.4.2-rc9-debug.apk > tmp/android/TestDPLS-1.4.2-rc9-debug.apk.sha256
          printf 'version=1.4.2\nrc=9\ncommit=%s\nvariant=debug\n' "$GITHUB_SHA" > tmp/android/BUILD.txt
      - uses: actions/upload-artifact@v6
        with:
          name: test-dpls-android-1.4.2-rc9
          path: tmp/android
          if-no-files-found: error
          retention-days: 7

  firmware_image:
    name: PHY6252 firmware / Arm Compiler 6.24
    needs: smoke
    if: needs.smoke.outputs.firmware == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-ac6-${{ hashFiles('firmware/targets/phy6252/vcpkg-configuration.json') }}
      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1
      - name: Build production image
        run: |
          set -euo pipefail
          mkdir -p tmp/firmware
          bash tools/build_firmware.sh tmp/firmware/TestDPLS-1.4.2-rc9.hex 2>&1 | tee tmp/firmware/build.log
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/firmware/test-dpls.axf
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/firmware/test-dpls.map
          sha256sum tmp/firmware/TestDPLS-1.4.2-rc9.hex > tmp/firmware/TestDPLS-1.4.2-rc9.hex.sha256
          printf 'version=1.4.2\nrc=9\ncommit=%s\ntoolchain=Arm-Compiler-6.24.0\n' "$GITHUB_SHA" > tmp/firmware/BUILD.txt
      - uses: actions/upload-artifact@v6
        with:
          name: test-dpls-phy6252-1.4.2-rc9
          path: tmp/firmware
          if-no-files-found: error
          retention-days: 7

  firmverse:
    name: PHY6252 Firmverse
    needs: [smoke, firmware_image]
    if: needs.smoke.outputs.firmware == 'true' && needs.firmware_image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: test-dpls-phy6252-1.4.2-rc9
          path: tmp/firmware
      - name: Run the production image in Firmverse
        id: firmverse
        uses: Pom4H/firmverse@7b6b480ab887151ebe657f15bf109ec8b8c4a56f
        with:
          firmware: tmp/firmware/TestDPLS-1.4.2-rc9.hex
          board: pb03f-kit
          strict: 'true'
          max-insns: '3000000'
          expect: |
            BLE HCI LE_SetAdvEnable enabled=1
          log: tmp/firmverse.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-dpls-firmverse
          path: ${{ steps.firmverse.outputs.log }}
          if-no-files-found: warn
          retention-days: 3

  firmware_quality:
    name: Firmware coverage + cppcheck
    needs: smoke
    if: needs.smoke.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Tests + coverage
        run: bash tools/coverage_firmware.sh
      - name: cppcheck
        run: bash tools/lint_firmware.sh

  soft_ble_e2e:
    name: Soft-BLE DplsClient ↔ simulator
    needs: smoke
    if: needs.smoke.outputs.soft_ble == 'true' || needs.smoke.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run soft-BLE phone E2E scenarios
        run: bash tools/soft_ble_e2e.sh

  ios:
    name: iOS adapter + Xcode host
    needs: smoke
    if: needs.smoke.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run common tests on Kotlin/Native
        working-directory: mobile
        run: ./gradlew :wire:iosSimulatorArm64Test :runtime:iosSimulatorArm64Test :core:iosSimulatorArm64Test
      - name: Compile DplsCore for iOS simulator
        working-directory: mobile
        run: ./gradlew :core:linkDebugFrameworkIosSimulatorArm64
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          for runtime in data.values():
              for d in runtime:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run native Xcode integration smoke test
        run: |
          xcodebuild test \
            -project mobile/ios/TestDPLS.xcodeproj \
            -scheme TestDPLS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO

  release_gate:
    name: RC production gate
    needs:
      - smoke
      - android
      - firmware_image
      - firmverse
      - firmware_quality
      - soft_ble_e2e
      - ios
    if: always() && needs.smoke.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every affected RC check to pass
        shell: bash
        env:
          SMOKE: ${{ needs.smoke.result }}
          ANDROID: ${{ needs.android.result }}
          FIRMWARE_IMAGE: ${{ needs.firmware_image.result }}
          FIRMVERSE: ${{ needs.firmverse.result }}
          QUALITY: ${{ needs.firmware_quality.result }}
          SOFT_BLE: ${{ needs.soft_ble_e2e.result }}
          IOS: ${{ needs.ios.result }}
          NEED_ANDROID: ${{ needs.smoke.outputs.android }}
          NEED_IOS: ${{ needs.smoke.outputs.ios }}
          NEED_FIRMWARE: ${{ needs.smoke.outputs.firmware }}
          NEED_SOFT_BLE: ${{ needs.smoke.outputs.soft_ble }}
        run: |
          set -euo pipefail

          require_if_needed() {
            local name="$1" result="$2" needed="$3"
            printf '%-20s %-10s needed=%s\n' "$name" "$result" "$needed"
            if [[ "$needed" == "true" ]]; then
              [[ "$result" == "success" ]] || return 1
            else
              [[ "$result" == "success" || "$result" == "skipped" ]] || return 1
            fi
          }

          [[ "$SMOKE" == "success" ]]
          require_if_needed android "$ANDROID" "$NEED_ANDROID"
          require_if_needed ios "$IOS" "$NEED_IOS"
          require_if_needed firmware-image "$FIRMWARE_IMAGE" "$NEED_FIRMWARE"
          require_if_needed firmverse "$FIRMVERSE" "$NEED_FIRMWARE"
          require_if_needed firmware-quality "$QUALITY" "$NEED_FIRMWARE"
          if [[ "$NEED_FIRMWARE" == "true" || "$NEED_SOFT_BLE" == "true" ]]; then
            require_if_needed soft-ble-e2e "$SOFT_BLE" true
          else
            require_if_needed soft-ble-e2e "$SOFT_BLE" false
          fi
          echo 'RC affected-area production gate: PASS'
