name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-host-tests:
    # Portable DPLS core (protocol, server, LED, calibration) built with the
    # system compiler and exercised by ctest. The PHY6252 image is built by
    # firmware-target.yml (Keil/AC6 and GCC).
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Firmware -B Firmware/build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build Firmware/build
      - name: Test
        run: ctest --test-dir Firmware/build --output-on-failure

  firmware-pinout-contract:
    name: Revision 2 pinout contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify rev2 pin assignment and four-channel scanning
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#define DPLS_PIN_PORT1_ADC GPIO_P20' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT2_ADC GPIO_P15' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT_T_ADC GPIO_P24' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_VCAP_ADC GPIO_P23' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_KZ_1 GPIO_P14' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_RED GPIO_P07' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_GREEN GPIO_P11' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_BLUE GPIO_P18' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_FACTORY_RESET GPIO_P34' Firmware/phy6252/dpls_board.h
          # The sampler derives its channel from the pin macros above, so the
          # mapping is checked where it now lives instead of in the driver.
          grep -q '#define DPLS_ADC_CHANNEL_GPIO_P20 ADC_CH3P_P20' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_ADC_CHANNEL_GPIO_P15 ADC_CH3N_P15' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_ADC_CHANNEL_GPIO_P24 ADC_CH2N_P24' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_ADC_CHANNEL_GPIO_P23 ADC_CH1P_P23' Firmware/phy6252/dpls_board.h
          grep -q 'ADC_BIT(DPLS_ADC_CHANNEL(DPLS_PIN_PORT1_ADC))' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'ADC_BIT(DPLS_ADC_CHANNEL(DPLS_PIN_VCAP_ADC))' Firmware/phy6252/dpls_phy6252_app.c
          # P11 drives the RGB green channel, so it must never be sampled.
          ! grep -q 'ADC_CH1N_P11' Firmware/phy6252/dpls_board.h Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_ADC_NEED_ALL' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'hal.port2_voltage_mv = port2_voltage_mv' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'hal.port_t_voltage_mv = port_t_voltage_mv' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_STATE_PORT_2_VALID' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_STATE_PORT_T_VALID' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'STATE_REFRESH_MS = 1_000L' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/BleClient.kt
          grep -q 'port2VoltageValid' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/BleClient.kt
          test -f docs/live-voltage-requirements.md

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: TestDPLS
        run: ./gradlew testDebugUnitTest
      - name: Lint
        working-directory: TestDPLS
        run: ./gradlew lintDebug
      - name: Assemble debug APK
        working-directory: TestDPLS
        run: ./gradlew assembleDebug
