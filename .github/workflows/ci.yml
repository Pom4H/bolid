name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  firmware-host-tests:
    name: Firmware host tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install firmware lint tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Build, test and lint firmware
        run: bash tools/lint_firmware.sh
      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cppcheck
          path: tmp/cppcheck.txt
          if-no-files-found: warn

  android-contract:
    name: Source and documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify required source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'minSdk = 26' TestDPLS/app/build.gradle.kts
          grep -q 'versionCode = 5' TestDPLS/app/build.gradle.kts
          grep -q 'versionName = "1.1.2"' TestDPLS/app/build.gradle.kts
          grep -q 'screenOrientation="portrait"' TestDPLS/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' TestDPLS/app/src/main/AndroidManifest.xml
          grep -q 'androidx.core.content.FileProvider' TestDPLS/app/src/main/AndroidManifest.xml
          grep -q 'FLAG_SECURE' TestDPLS/app/src/main/java/ru/bolid/testdpls/MainActivity.kt
          grep -q 'Build.VERSION_CODES.S' TestDPLS/app/src/main/java/ru/bolid/testdpls/MainActivity.kt
          grep -q 'readRemoteRssi' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/BleClient.kt
          grep -q 'SCAN_DURATION_MS = 60_000L' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/BleClient.kt
          grep -q 'STATE_REFRESH_MS = 1_000L' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/BleClient.kt
          grep -q 'state.authenticated && !state.commandInProgress && state.state != null' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/BleClient.kt
          grep -q 'port2VoltageValid' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/BleClient.kt
          grep -q 'CONNECTION_TIMEOUT_MILLIS = 10_000L' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/AndroidComplianceRules.kt
          grep -q 'IDENTIFY_DURATION_SECONDS = 60' TestDPLS/app/src/main/java/ru/bolid/testdpls/ble/AndroidComplianceRules.kt
          grep -q 'isMinifyEnabled = true' TestDPLS/app/build.gradle.kts
          grep -q 'isShrinkResources = true' TestDPLS/app/build.gradle.kts

          grep -q '#define DPLS_PIN_PORT1_ADC GPIO_P20' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT2_ADC GPIO_P15' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT_T_ADC GPIO_P24' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_VCAP_ADC GPIO_P23' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_KZ_1 GPIO_P14' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_RED GPIO_P07' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_GREEN GPIO_P11' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_BLUE GPIO_P18' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_FACTORY_RESET GPIO_P34' Firmware/phy6252/dpls_board.h
          grep -q 'ADC_CH3P_P20' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'ADC_CH3N_P15' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'ADC_CH2N_P24' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'ADC_CH1P_P23' Firmware/phy6252/dpls_phy6252_app.c
          ! grep -q 'ADC_CH1N_P11' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_PIN_LED_GREEN, on ? 1 : 0' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_ADC_NEED_ALL' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'hal.port2_voltage_mv = port2_voltage_mv' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'hal.port_t_voltage_mv = port_t_voltage_mv' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_STATE_PORT_2_VALID' Firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_STATE_PORT_T_VALID' Firmware/phy6252/dpls_phy6252_app.c

          test -f TestDPLS/BUILD.md
          test -f docs/android-compliance.md
          test -f docs/android-pmi.md
          test -f docs/android-operator-guide.md
          test -f docs/oss-register.md
          test -f docs/live-voltage-requirements.md
          test -f tools/generate_behavior_sim.py
          test ! -f docs/behavior-sim.html
          test ! -f tools/apply_four_channel_adc_release.py
          test ! -f .github/workflows/apply-four-channel-adc.yml
          test ! -f tools/apply_rgb_preserving_pinout.py
          test ! -f .github/workflows/apply-rgb-preserving-pinout.yml
          test ! -f tools/patches/android-compliance.patch
          test ! -f tools/apply_android_compliance.py
          test ! -f .github/workflows/apply-android-compliance.yml
      - name: Validate documentation introspection
        run: |
          python3 tools/generate_behavior_sim.py --output /tmp/test-dpls-behavior-sim.html
          test -s /tmp/test-dpls-behavior-sim.html
          grep -q '"firmware":"1.1.3"' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_PORT1_ADC' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_PORT2_ADC' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_PORT_T_ADC' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_VCAP_ADC' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_LED_RED' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_LED_GREEN' /tmp/test-dpls-behavior-sim.html
          grep -q 'DPLS_PIN_LED_BLUE' /tmp/test-dpls-behavior-sim.html

  android:
    name: Android tests + minified release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Clean
        working-directory: TestDPLS
        run: ./gradlew --no-daemon clean
      - name: Unit tests
        working-directory: TestDPLS
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: JaCoCo coverage
        working-directory: TestDPLS
        run: ./gradlew --no-daemon jacocoTestReport
      - name: Coverage summary
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          report = "TestDPLS/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
          root = ET.parse(report).getroot()
          counters = {item.attrib["type"]: item.attrib for item in root.findall("counter")}
          def metric(kind):
              covered = int(counters[kind]["covered"])
              missed = int(counters[kind]["missed"])
              total = covered + missed
              percent = covered * 100.0 / total if total else 100.0
              return covered, total, percent
          line = metric("LINE")
          branch = metric("BRANCH")
          instruction = metric("INSTRUCTION")
          text = (
              f"## Android unit-test coverage\n\n"
              f"- Lines: **{line[2]:.2f}%** ({line[0]}/{line[1]})\n"
              f"- Branches: **{branch[2]:.2f}%** ({branch[0]}/{branch[1]})\n"
              f"- Instructions: **{instruction[2]:.2f}%** ({instruction[0]}/{instruction[1]})\n"
          )
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(text)
      - name: Lint release
        working-directory: TestDPLS
        run: ./gradlew --no-daemon lintRelease
      - name: Assemble minified release APK
        working-directory: TestDPLS
        run: ./gradlew --no-daemon assembleRelease
      - name: Bundle minified release AAB
        working-directory: TestDPLS
        run: ./gradlew --no-daemon bundleRelease
      - name: Upload Android release packages
        uses: actions/upload-artifact@v4
        with:
          name: test-dpls-android-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            TestDPLS/app/build/outputs/apk/release/*.apk
            TestDPLS/app/build/outputs/bundle/release/*.aab
            TestDPLS/app/build/outputs/mapping/release/*
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dpls-android-reports-${{ github.sha }}
          if-no-files-found: warn
          path: |
            TestDPLS/app/build/reports/tests/
            TestDPLS/app/build/reports/jacoco/
            TestDPLS/app/build/reports/lint-results-*.html
            TestDPLS/app/build/reports/lint-results-*.xml
