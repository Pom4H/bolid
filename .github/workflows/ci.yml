name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Cheap PR smoke
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
      firmware: ${{ steps.changes.outputs.firmware }}
      replay: ${{ steps.changes.outputs.replay }}
      release_pr: ${{ steps.changes.outputs.release_pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect changed areas and RC policy
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          release_pr=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            echo "replay=true" >> "$GITHUB_OUTPUT"
            echo "release_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed.txt
          cat /tmp/changed.txt

          mobile=false
          firmware=false
          replay=false
          if grep -qE '^mobile/' /tmp/changed.txt; then mobile=true; fi
          if grep -qE '^(firmware/|tools/(coverage_firmware|lint_firmware|build_firmware|fetch_phy6252_sdk|run_host_invariant_gate)\.sh|tools/(architecture_guard|test_ci_contract)\.py)' /tmp/changed.txt; then firmware=true; fi
          if grep -qE '^(tools/session_capture/|firmware/(sim|src|include|phy6252_emu)/)' /tmp/changed.txt; then replay=true; fi

          if [[ "$HEAD_REF" == release/* ]]; then
            release_pr=true
            mobile=true
            firmware=true
            replay=true
          fi

          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "replay=$replay" >> "$GITHUB_OUTPUT"
          echo "release_pr=$release_pr" >> "$GITHUB_OUTPUT"
      - name: Host invariants + sanitizers
        run: bash tools/run_host_invariant_gate.sh
      - name: Verify revision 2 pinout contract
        run: |
          grep -q 'DPLS_BOARD_ASSERT(factory_reset_p34' firmware/phy6252/dpls_board.h
          grep -q 'ADC_BIT(DPLS_ADC_CHANNEL(DPLS_PIN_PORT1_ADC))' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'ADC_BIT(DPLS_ADC_CHANNEL(DPLS_PIN_VCAP_ADC))' firmware/phy6252/dpls_phy6252_app.c
          ! grep -q 'ADC_CH1N_P11' firmware/phy6252/dpls_board.h firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_ADC_NEED_ALL' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'hal.hardware.port2_voltage_mv = port2_voltage_mv' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'hal.hardware.port_t_voltage_mv = port_t_voltage_mv' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_STATE_PORT_2_VALID' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_STATE_PORT_T_VALID' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'STATE_REFRESH_MS = 1_000L' mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsClient.kt
          grep -q 'port2VoltageValid' mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/domain/DeviceModel.kt
          test -f docs/live-voltage-requirements.md

  android:
    name: Android unit tests
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true' || needs.smoke.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Shared runtime/core tests
        working-directory: mobile
        run: ./gradlew :wire:testDebugUnitTest :runtime:testDebugUnitTest :core:testDebugUnitTest
      - name: Full Android lint + APK
        if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true'
        working-directory: mobile
        run: ./gradlew :wire:lintDebug :runtime:lintDebug :core:lintDebug :android:lintDebug :android:assembleDebug
      - name: Stage installable APK
        if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/android
          cp mobile/android/build/outputs/apk/debug/android-debug.apk tmp/android/TestDPLS-1.4.2-rc6-debug.apk
          sha256sum tmp/android/TestDPLS-1.4.2-rc6-debug.apk > tmp/android/TestDPLS-1.4.2-rc6-debug.apk.sha256
          printf 'version=1.4.2\nrc=6\ncommit=%s\nvariant=debug\n' "$GITHUB_SHA" > tmp/android/BUILD.txt
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true'
        with:
          name: test-dpls-android-1.4.2-rc6
          path: tmp/android
          if-no-files-found: error
          retention-days: 7

  firmverse:
    name: PHY6252 Firmverse
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true' || needs.smoke.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup cached ARM GNU Toolchain
        uses: ./.github/actions/setup-arm-gcc
      - name: Build production PHY6252 HEX
        run: |
          mkdir -p tmp
          bash tools/build_firmware.sh gcc tmp/test-dpls-firmverse.hex
      - name: Run production HEX in Firmverse
        id: firmverse
        uses: Pom4H/firmverse@v1
        with:
          firmware: tmp/test-dpls-firmverse.hex
          board: pb03f-kit
          strict: 'true'
          log: tmp/firmverse.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-dpls-firmverse
          path: |
            tmp/test-dpls-firmverse.hex
            ${{ steps.firmverse.outputs.log }}
          if-no-files-found: warn
          retention-days: 3

  firmware_quality:
    name: Firmware coverage + cppcheck
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Tests + coverage
        run: bash tools/coverage_firmware.sh
      - name: cppcheck
        run: bash tools/lint_firmware.sh

  soft_ble_e2e:
    name: Soft-BLE DplsClient ↔ simulator
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run soft-BLE phone E2E scenarios
        run: bash tools/soft_ble_e2e.sh

  firmware_gcc:
    name: PHY6252 GNU Arm GCC
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup cached ARM GNU Toolchain
        uses: ./.github/actions/setup-arm-gcc
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Build
        run: |
          set -o pipefail
          mkdir -p tmp/gcc
          bash tools/build_firmware.sh gcc tmp/gcc/test-dpls-gcc.hex 2>&1 | tee tmp/gcc/gcc-build.log
          sha256sum tmp/gcc/test-dpls-gcc.hex > tmp/gcc/test-dpls-gcc.hex.sha256
          printf 'version=1.4.2\nrc=6\ncommit=%s\ntoolchain=GNU-Arm-13.2.1\n' "$GITHUB_SHA" > tmp/gcc/BUILD.txt
      - uses: actions/upload-artifact@v6
        with:
          name: test-dpls-phy6252-gcc
          path: |
            tmp/gcc
            firmware/targets/phy6252/build/test-dpls.elf
            firmware/targets/phy6252/build/test-dpls.map
          if-no-files-found: error
          retention-days: 7

  firmware_keil:
    name: PHY6252 Keil MDK / AC6
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-keil-ac6-${{ hashFiles('firmware/targets/phy6252/vcpkg-configuration.json') }}
      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1
      - name: Build
        run: |
          set -o pipefail
          mkdir -p tmp/keil
          bash tools/build_firmware.sh keil tmp/keil/TestDPLS-1.4.2-rc6.hex 2>&1 | tee tmp/keil/keil-build.log
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/keil/test-dpls.axf
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/keil/test-dpls.map
          sha256sum tmp/keil/TestDPLS-1.4.2-rc6.hex > tmp/keil/TestDPLS-1.4.2-rc6.hex.sha256
          printf 'version=1.4.2\nrc=6\ncommit=%s\ntoolchain=Arm-Compiler-6.24.0\npreferred_for_hardware=yes\n' "$GITHUB_SHA" > tmp/keil/BUILD.txt
      - uses: actions/upload-artifact@v6
        with:
          name: test-dpls-phy6252-keil-1.4.2-rc6
          path: tmp/keil
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS adapter + Xcode host
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.release_pr == 'true'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run common tests on Kotlin/Native
        working-directory: mobile
        run: ./gradlew :wire:iosSimulatorArm64Test :runtime:iosSimulatorArm64Test :core:iosSimulatorArm64Test
      - name: Compile DplsCore for iOS simulator
        working-directory: mobile
        run: ./gradlew :core:linkDebugFrameworkIosSimulatorArm64
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          for runtime in data.values():
              for d in runtime:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run native Xcode integration smoke test
        run: |
          xcodebuild test \
            -project mobile/ios/TestDPLS.xcodeproj \
            -scheme TestDPLS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO

  release_gate:
    name: RC production gate
    needs:
      - smoke
      - android
      - firmverse
      - firmware_quality
      - soft_ble_e2e
      - firmware_gcc
      - firmware_keil
      - ios
    if: always() && needs.smoke.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every RC check to pass
        shell: bash
        env:
          SMOKE: ${{ needs.smoke.result }}
          ANDROID: ${{ needs.android.result }}
          FIRMVERSE: ${{ needs.firmverse.result }}
          QUALITY: ${{ needs.firmware_quality.result }}
          SOFT_BLE: ${{ needs.soft_ble_e2e.result }}
          GCC: ${{ needs.firmware_gcc.result }}
          KEIL: ${{ needs.firmware_keil.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          printf '%-20s %s\n' \
            smoke "$SMOKE" \
            android "$ANDROID" \
            firmverse "$FIRMVERSE" \
            firmware-quality "$QUALITY" \
            soft-ble-e2e "$SOFT_BLE" \
            firmware-gcc "$GCC" \
            firmware-keil "$KEIL" \
            ios "$IOS"
          for result in "$SMOKE" "$ANDROID" "$FIRMVERSE" "$QUALITY" "$SOFT_BLE" "$GCC" "$KEIL" "$IOS"; do
            [[ "$result" == success ]] || exit 1
          done
          echo 'RC production gate: PASS'
