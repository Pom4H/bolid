name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.pdf"
      - "**/*.docx"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Cheap PR smoke
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
      firmware: ${{ steps.changes.outputs.firmware }}
      replay: ${{ steps.changes.outputs.replay }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true

      - name: Detect changed areas
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            echo "replay=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed.txt
          cat /tmp/changed.txt

          mobile=false
          firmware=false
          replay=false
          if grep -qE '^mobile/' /tmp/changed.txt; then mobile=true; fi
          if grep -qE '^(firmware/|tools/(coverage_firmware|lint_firmware|build_firmware|fetch_phy6252_sdk)\.sh)' /tmp/changed.txt; then firmware=true; fi
          if grep -qE '^(tools/session_capture/|firmware/(sim|src|include|phy6252_emu)/)' /tmp/changed.txt; then replay=true; fi

          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "replay=$replay" >> "$GITHUB_OUTPUT"

      - name: Verify repository layout
        run: bash tools/check_repo_layout.sh
      - name: Verify language-neutral wire contract
        run: python3 tools/test_dpls_protocol_crc.py
      - name: Verify session capture smoke
        run: python3 tools/session_capture/test_session_capture.py
      - name: Verify architecture ownership
        run: python3 tools/architecture_guard.py

      - name: Verify revision 2 pinout contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#define DPLS_PIN_PORT1_ADC GPIO_P20' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT2_ADC GPIO_P15' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT_T_ADC GPIO_P24' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_VCAP_ADC GPIO_P23' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_KZ_1 GPIO_P14' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_RED GPIO_P07' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_GREEN GPIO_P11' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_BLUE GPIO_P18' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_FACTORY_RESET GPIO_P34' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_ADC_CHANNEL_GPIO_P20 ADC_CH3P_P20' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_ADC_CHANNEL_GPIO_P15 ADC_CH3N_P15' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_ADC_CHANNEL_GPIO_P24 ADC_CH2N_P24' firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_ADC_CHANNEL_GPIO_P23 ADC_CH1P_P23' firmware/phy6252/dpls_board.h
          grep -q 'DPLS_BOARD_ASSERT(factory_reset_p34' firmware/phy6252/dpls_board.h
          grep -q 'ADC_BIT(DPLS_ADC_CHANNEL(DPLS_PIN_PORT1_ADC))' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'ADC_BIT(DPLS_ADC_CHANNEL(DPLS_PIN_VCAP_ADC))' firmware/phy6252/dpls_phy6252_app.c
          ! grep -q 'ADC_CH1N_P11' firmware/phy6252/dpls_board.h firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_ADC_NEED_ALL' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'hal.hardware.port2_voltage_mv = port2_voltage_mv' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'hal.hardware.port_t_voltage_mv = port_t_voltage_mv' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_STATE_PORT_2_VALID' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'DPLS_STATE_PORT_T_VALID' firmware/phy6252/dpls_phy6252_app.c
          grep -q 'STATE_REFRESH_MS = 1_000L' mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsClient.kt
          grep -q 'port2VoltageValid' mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/domain/DplsDomain.kt
          test -f docs/live-voltage-requirements.md

      - name: Fast firmware host tests
        if: steps.changes.outputs.firmware == 'true' || steps.changes.outputs.replay == 'true'
        run: |
          cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/build --parallel 2
          ctest --test-dir firmware/build --output-on-failure

      - name: Differential captured-session replay
        if: steps.changes.outputs.replay == 'true'
        shell: bash
        run: |
          if [[ -f tools/session_capture/test_differential_replay.py ]]; then
            DPLS_SIMULATOR="$PWD/firmware/build/dpls_simulator" \
              python3 tools/session_capture/test_differential_replay.py
          else
            echo "differential replay test not present on this branch"
          fi

  android:
    name: Android unit tests
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Shared runtime/core tests
        working-directory: mobile
        run: ./gradlew :wire:testDebugUnitTest :runtime:testDebugUnitTest :core:testDebugUnitTest
      - name: Full Android lint + APK
        if: github.event_name != 'pull_request'
        working-directory: mobile
        run: ./gradlew :wire:lintDebug :runtime:lintDebug :core:lintDebug :android:lintDebug :android:assembleDebug

  firmware-quality:
    name: Firmware coverage + cppcheck
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Tests + coverage
        run: bash tools/coverage_firmware.sh
      - name: cppcheck
        run: bash tools/lint_firmware.sh

  soft-ble-e2e:
    name: Soft-BLE DplsClient ↔ simulator
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run soft-BLE phone E2E scenarios
        run: bash tools/soft_ble_e2e.sh

  firmware-zmu-e2e:
    name: Firmware ↔ mobile ZMU E2E
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install ARM GCC + Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build zmu-cortex-m0
        run: bash tools/fetch_zmu.sh tmp/zmu
      - name: Run all ZMU scenarios
        run: bash tools/zmu_run_all.sh tmp/zmu/target/release/zmu-cortex-m0

  firmware-gcc:
    name: PHY6252 GNU Arm GCC
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install GNU Arm Embedded
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Build
        run: |
          set -o pipefail
          mkdir -p tmp
          bash tools/build_firmware.sh gcc tmp/test-dpls-gcc.hex 2>&1 | tee tmp/gcc-build.log
      - uses: actions/upload-artifact@v6
        with:
          name: test-dpls-phy6252-gcc
          path: |
            tmp/test-dpls-gcc.hex
            firmware/targets/phy6252/build/test-dpls.elf
            firmware/targets/phy6252/build/test-dpls.map
          if-no-files-found: error
          retention-days: 3

  firmware-keil:
    name: PHY6252 Keil MDK / AC6
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-keil-ac6-${{ hashFiles('firmware/targets/phy6252/vcpkg-configuration.json') }}
      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1
      - name: Build
        run: |
          set -o pipefail
          mkdir -p tmp
          bash tools/build_firmware.sh keil tmp/test-dpls.hex 2>&1 | tee tmp/keil-build.log
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/test-dpls.axf
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/test-dpls.map
      - uses: actions/upload-artifact@v6
        with:
          name: test-dpls-phy6252-keil
          path: |
            tmp/test-dpls.hex
            tmp/test-dpls.axf
            tmp/test-dpls.map
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS adapter + Xcode host
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run common tests on Kotlin/Native
        working-directory: mobile
        run: ./gradlew :wire:iosSimulatorArm64Test :runtime:iosSimulatorArm64Test :core:iosSimulatorArm64Test
      - name: Compile DplsCore for iOS simulator
        working-directory: mobile
        run: ./gradlew :core:linkDebugFrameworkIosSimulatorArm64
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          for runtime in data.values():
              for d in runtime:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run native Xcode integration smoke test
        run: |
          xcodebuild test \
            -project mobile/ios/TestDPLS.xcodeproj \
            -scheme TestDPLS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO
