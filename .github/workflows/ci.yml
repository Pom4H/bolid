name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-host-tests:
    # Portable DPLS core (protocol, server, LED, calibration) built with the
    # system compiler and exercised by ctest. The target PHY6252 image is built
    # separately with the proprietary ARM Compiler (tools/build_firmware.sh) and
    # is out of scope for hosted CI.
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Firmware -B Firmware/build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build Firmware/build
      - name: Test
        run: ctest --test-dir Firmware/build --output-on-failure

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: TestDPLS
        run: ./gradlew testDebugUnitTest
      - name: Lint
        working-directory: TestDPLS
        run: ./gradlew lintDebug
      - name: Assemble debug APK
        working-directory: TestDPLS
        run: ./gradlew assembleDebug

  windows-core-tests:
    name: Windows client protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test protocol core
        working-directory: TestDPLS-Windows
        run: dotnet test tests/TestDPLS.Core.Tests/TestDPLS.Core.Tests.csproj --configuration Release
