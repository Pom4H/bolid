name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-host-tests:
    # Portable DPLS core (protocol, server, LED, calibration) built with the
    # system compiler, exercised by ctest and checked with cppcheck. The target
    # PHY6252 image and the third-party SDK are checked separately.
    name: Firmware host tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install firmware lint tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Build, test and lint firmware
        run: bash tools/lint_firmware.sh

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: TestDPLS
        run: ./gradlew testDebugUnitTest
      - name: Lint
        working-directory: TestDPLS
        run: ./gradlew lintDebug
      - name: Assemble debug APK
        working-directory: TestDPLS
        run: ./gradlew assembleDebug
