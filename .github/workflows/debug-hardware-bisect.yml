name: DEBUG hardware bisect images

on:
  push:
    branches:
      - debug/rc6-advertising-gate-bisect
  workflow_dispatch:

jobs:
  rc6-gate-bisect:
    name: RC6 advertising-gate bypass / Keil AC6
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-debug-keil-ac6-${{ hashFiles('firmware/targets/phy6252/vcpkg-configuration.json') }}
      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1
      - name: Build diagnostic RC6
        run: |
          set -euo pipefail
          mkdir -p tmp/debug-rc6
          bash tools/build_firmware.sh keil tmp/debug-rc6/TestDPLS-RC6-GATE-BISECT.hex 2>&1 | tee tmp/debug-rc6/build.log
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/debug-rc6/test-dpls.axf
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/debug-rc6/test-dpls.map
          sha256sum tmp/debug-rc6/TestDPLS-RC6-GATE-BISECT.hex > tmp/debug-rc6/TestDPLS-RC6-GATE-BISECT.hex.sha256
          printf 'purpose=hardware-bisect\nvariant=rc6-advertising-gates-bypassed\ncommit=%s\ntoolchain=Arm-Compiler-6.24.0\n' "$GITHUB_SHA" > tmp/debug-rc6/BUILD.txt
      - uses: actions/upload-artifact@v6
        with:
          name: DEBUG-RC6-GATE-BISECT
          path: tmp/debug-rc6
          if-no-files-found: error
          retention-days: 7

  control-140:
    name: Exact 1.4.0 source / current Keil AC6
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4d421f9105d1b3c0160239002ee1bed1aea4a535
      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-debug-keil-ac6-${{ hashFiles('firmware/targets/phy6252/vcpkg-configuration.json') }}
      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1
      - name: Build exact 1.4.0 source
        run: |
          set -euo pipefail
          mkdir -p tmp/control-140
          bash tools/build_firmware.sh keil tmp/control-140/TestDPLS-1.4.0-CONTROL-REBUILD.hex 2>&1 | tee tmp/control-140/build.log
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/control-140/test-dpls.axf
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/control-140/test-dpls.map
          sha256sum tmp/control-140/TestDPLS-1.4.0-CONTROL-REBUILD.hex > tmp/control-140/TestDPLS-1.4.0-CONTROL-REBUILD.hex.sha256
          printf 'purpose=hardware-control\nsource_commit=4d421f9105d1b3c0160239002ee1bed1aea4a535\ntoolchain=Arm-Compiler-6.24.0\n' > tmp/control-140/BUILD.txt
      - uses: actions/upload-artifact@v6
        with:
          name: DEBUG-1.4.0-CONTROL-REBUILD
          path: tmp/control-140
          if-no-files-found: error
          retention-days: 7
