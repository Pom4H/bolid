name: Diagnostic Keil GATT parity

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-keil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keil:
    name: Build PHY6252 with Keil AC6
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-keil-ac6-${{ hashFiles('firmware/targets/phy6252/vcpkg-configuration.json') }}
      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1
      - name: Build
        run: |
          set -o pipefail
          mkdir -p tmp
          bash tools/build_firmware.sh keil tmp/test-dpls-keil-diag.hex 2>&1 | tee tmp/keil-build.log
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/test-dpls.axf
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/test-dpls.map
      - uses: actions/upload-artifact@v6
        with:
          name: test-dpls-keil-gatt-parity
          path: |
            tmp/test-dpls-keil-diag.hex
            tmp/test-dpls.axf
            tmp/test-dpls.map
            tmp/keil-build.log
          if-no-files-found: error
          retention-days: 3
