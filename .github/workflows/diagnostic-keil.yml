name: Diagnostic Keil GATT parity

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-keil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keil:
    name: Build PHY6252 with Keil AC6
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Apply watchdog diagnostic patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('firmware/targets/phy6252/source/dplsBLEPeripheral.c')
          text = path.read_text()

          needle = '#include "pwrmgr.h"\n#include "fs.h"'
          replacement = '#include "pwrmgr.h"\n#include "watchdog.h"\n#include "fs.h"'
          if needle not in text:
              raise SystemExit('include anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '    app_task_id = task_id;\n'
          replacement = (
              '    app_task_id = task_id;\n'
              '    /* Diagnostic only: vendor main starts WDG_2S. Real-hardware logs\n'
              '     * show RSTC_WARM_UP during active GATT traffic, so widen it while\n'
              '     * checking whether the BLE instability is watchdog-driven. */\n'
              '    (void)watchdog_config(WDG_8S);\n'
          )
          if needle not in text:
              raise SystemExit('init anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = 'uint16 SimpleBLEPeripheral_ProcessEvent(uint8 task_id, uint16 events)\n{\n    (void)task_id;\n'
          replacement = (
              'uint16 SimpleBLEPeripheral_ProcessEvent(uint8 task_id, uint16 events)\n'
              '{\n'
              '    (void)task_id;\n'
              '    /* Diagnostic only: prove the OSAL loop is alive often enough and\n'
              '     * keep the vendor watchdog away from legitimate BLE/flash work. */\n'
              '    hal_watchdog_feed();\n'
          )
          if needle not in text:
              raise SystemExit('event anchor not found')
          text = text.replace(needle, replacement, 1)

          path.write_text(text)
          PY
          grep -n 'watchdog_config\|hal_watchdog_feed' firmware/targets/phy6252/source/dplsBLEPeripheral.c
      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-keil-ac6-${{ hashFiles('firmware/targets/phy6252/vcpkg-configuration.json') }}
      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1
      - name: Build
        run: |
          set -o pipefail
          mkdir -p tmp
          bash tools/build_firmware.sh keil tmp/test-dpls-keil-watchdog-diag.hex 2>&1 | tee tmp/keil-build.log
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/test-dpls.axf
          cp firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/test-dpls.map
      - uses: actions/upload-artifact@v6
        with:
          name: test-dpls-keil-watchdog-diag
          path: |
            tmp/test-dpls-keil-watchdog-diag.hex
            tmp/test-dpls.axf
            tmp/test-dpls.map
            tmp/keil-build.log
          if-no-files-found: error
          retention-days: 3
