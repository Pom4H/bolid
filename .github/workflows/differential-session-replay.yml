name: Differential session replay

on:
  pull_request:
    paths:
      - "tools/session_capture/differential_replay.py"
      - "tools/session_capture/test_differential_replay.py"
      - "tools/session_capture/dpls_wire.py"
      - "firmware/**"
      - ".github/workflows/differential-session-replay.yml"
  workflow_dispatch:

jobs:
  replay-real-session-shape:
    name: Captured session → fresh C simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build dpls_simulator
        run: |
          cmake -S firmware -B firmware/build
          cmake --build firmware/build --target dpls_simulator -j2
      - name: Differential replay E2E
        env:
          DPLS_SIMULATOR: firmware/build/dpls_simulator
        run: python3 tools/session_capture/test_differential_replay.py
