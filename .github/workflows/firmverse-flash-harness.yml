name: RC9 Firmverse flash harness

on:
  pull_request:
    branches:
      - release/1.4.2-rc9
    paths:
      - 'firmware/**'
      - 'tools/build_firmware.sh'
      - 'tools/fetch_phy6252_sdk.sh'
      - '.github/workflows/firmverse-flash-harness.yml'
  push:
    branches:
      - release/1.4.2-rc9
    paths:
      - 'firmware/**'
      - 'tools/build_firmware.sh'
      - 'tools/fetch_phy6252_sdk.sh'
      - '.github/workflows/firmverse-flash-harness.yml'
  workflow_dispatch:

jobs:
  flash-production-hex:
    name: Production HEX -> ROM -> NOR -> boot -> BLE
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Install runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5

      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh

      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-ac6-${{ hashFiles('firmware/targets/phy6252/vcpkg-configuration.json') }}

      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build RC9 production PHY6252 HEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          bash tools/build_firmware.sh tmp/test-dpls-1.4.2-rc9.hex
          test -s tmp/test-dpls-1.4.2-rc9.hex
          sha256sum tmp/test-dpls-1.4.2-rc9.hex | tee tmp/test-dpls-1.4.2-rc9.hex.sha256

      - name: Checkout pinned Firmverse flash + boot harness
        uses: actions/checkout@v6
        with:
          repository: Pom4H/firmverse
          ref: b1a92e3e6f941bf0f55049087d6cb10dd76f1045
          path: tmp/firmverse
          submodules: recursive

      - name: Setup Rust for Firmverse
        uses: dtolnay/rust-toolchain@stable

      - name: Program RC9 image and reconstruct boot image from virtual NOR
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked \
            --manifest-path tmp/firmverse/Cargo.toml \
            --bin phy6252-flash -- \
            tmp/test-dpls-1.4.2-rc9.hex \
            --harness \
            --harness-flash-size 262144 \
            --harness-boot-hex tmp/test-dpls-1.4.2-rc9.boot.hex \
            2>&1 | tee tmp/firmverse-flash-harness.log

          test -s tmp/test-dpls-1.4.2-rc9.boot.hex
          sha256sum tmp/test-dpls-1.4.2-rc9.boot.hex | tee tmp/test-dpls-1.4.2-rc9.boot.hex.sha256
          grep -q 'verified .* image part(s) byte-for-byte in virtual NOR' tmp/firmverse-flash-harness.log
          grep -q 'reset observed by harness' tmp/firmverse-flash-harness.log
          grep -q 'boot image reconstructed from virtual NOR:' tmp/firmverse-flash-harness.log
          grep -q 'harness flash ok' tmp/firmverse-flash-harness.log

      - name: Boot only the image reconstructed from programmed NOR
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked \
            --manifest-path tmp/firmverse/Cargo.toml \
            --bin firmverse -- \
            tmp/test-dpls-1.4.2-rc9.boot.hex \
            --once \
            --strict \
            --max-insns 3000000 \
            2>&1 | tee tmp/firmverse-boot-from-nor.log

          grep -q 'BLE HCI LE_SetAdvEnable enabled=1' tmp/firmverse-boot-from-nor.log
          echo 'flash -> reset -> boot-from-NOR -> BLE advertising: PASS'

      - name: Upload flash-to-boot evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rc9-firmverse-flash-boot-chain
          path: |
            tmp/test-dpls-1.4.2-rc9.hex
            tmp/test-dpls-1.4.2-rc9.hex.sha256
            tmp/test-dpls-1.4.2-rc9.boot.hex
            tmp/test-dpls-1.4.2-rc9.boot.hex.sha256
            tmp/firmverse-flash-harness.log
            tmp/firmverse-boot-from-nor.log
          if-no-files-found: warn
          retention-days: 7
