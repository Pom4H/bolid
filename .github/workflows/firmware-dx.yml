name: Firmware DX

on:
  pull_request:
    paths:
      - 'tools/build_firmware.sh'
      - 'tools/flash_firmware.sh'
      - 'tools/test_flash_firmware.py'
      - 'firmware/targets/phy6252/vcpkg-configuration.json'
      - 'firmware/targets/phy6252/test-dpls.csolution.yml'
      - 'firmware/targets/phy6252/test-dpls.cproject.yml'
      - 'firmware/sdk/phy6252-sdk.env'
      - '.github/workflows/firmware-dx.yml'
  workflow_dispatch:

jobs:
  fresh-clone:
    name: Fresh clone → GCC build + flasher contract
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build from a clean clone with pinned GNU Arm
        shell: bash
        run: |
          set -euo pipefail
          ! command -v arm-none-eabi-gcc >/dev/null 2>&1 || true
          tools/build_firmware.sh gcc tmp/fresh-clone.hex
          test -s tmp/fresh-clone.hex
          grep -q '^:' tmp/fresh-clone.hex
      - name: Verify flasher CLI and post-flash contract
        shell: bash
        run: |
          set -euo pipefail
          tools/flash_firmware.sh --help
          python3 tools/test_flash_firmware.py

  # Production/release CI separately builds the same target with AC6 6.24
  # using ARM-software/cmsis-actions and its explicit license action. This DX
  # workflow intentionally stays license-independent so a flasher/tooling edit
  # cannot be blocked by Arm license provisioning.
