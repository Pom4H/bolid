name: PHY6252 AC6 target build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Firmware/**"
      - "tools/build_firmware.sh"
      - "tools/fetch_phy6252_sdk.sh"
      - ".github/workflows/firmware-target.yml"
  push:
    branches: [main]
    paths:
      - "Firmware/**"
      - "tools/build_firmware.sh"
      - "tools/fetch_phy6252_sdk.sh"
      - ".github/workflows/firmware-target.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-ac6:
    name: Build PHY6252 firmware with AC6
    runs-on: ubuntu-22.04
    env:
      ARM_LICENSE_CODE: ${{ secrets.ARM_LICENSE_CODE }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5

      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh

      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: Firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-ac6-${{ hashFiles('Firmware/targets/phy6252/vcpkg-configuration.json') }}

      - name: Block release builds without commercial Arm license
        if: github.event_name == 'push' && env.ARM_LICENSE_CODE == ''
        run: |
          echo "Repository secret ARM_LICENSE_CODE is required for main/release builds." >&2
          exit 1

      - name: Activate commercial Arm license
        if: env.ARM_LICENSE_CODE != ''
        uses: ARM-software/cmsis-actions/armlm@v1
        with:
          code: ${{ secrets.ARM_LICENSE_CODE }}

      - name: Activate evaluation Arm license for draft validation
        if: env.ARM_LICENSE_CODE == '' && github.event_name != 'push'
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Mark evaluation build
        if: env.ARM_LICENSE_CODE == '' && github.event_name != 'push'
        run: |
          echo "::warning::AC6 is using KEMDK-COM0 evaluation/non-commercial licensing. Do not use this artifact for release."

      - name: Build and package firmware
        run: bash tools/build_firmware.sh tmp/test-dpls-sdk-3.1.2.hex

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-dpls-phy6252-sdk-3.1.2
          path: |
            tmp/test-dpls-sdk-3.1.2.hex
            Firmware/targets/phy6252/out/**/*.axf
            Firmware/targets/phy6252/out/**/*.map
          if-no-files-found: error
