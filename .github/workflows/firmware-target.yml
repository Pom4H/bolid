name: PHY6252 firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Firmware/**"
      - "tools/build_firmware.sh"
      - "tools/fetch_phy6252_sdk.sh"
      - ".github/workflows/firmware-target.yml"
  push:
    branches: [main]
    paths:
      - "Firmware/**"
      - "tools/build_firmware.sh"
      - "tools/fetch_phy6252_sdk.sh"
      - ".github/workflows/firmware-target.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keil:
    name: Keil MDK / AC6
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: Firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-keil-ac6-${{ hashFiles('Firmware/targets/phy6252/vcpkg-configuration.json') }}
      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp
          bash tools/build_firmware.sh keil tmp/test-dpls.hex 2>&1 | tee tmp/keil-build.log
          cp Firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/test-dpls.axf
          cp Firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/test-dpls.map
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-dpls-phy6252-keil
          path: |
            tmp/keil-build.log
            tmp/test-dpls.hex
            tmp/test-dpls.axf
            tmp/test-dpls.map
          if-no-files-found: error

  gcc:
    name: GNU Arm GCC
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install GNU Arm Embedded
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp
          bash tools/build_firmware.sh gcc tmp/test-dpls-gcc.hex 2>&1 | tee tmp/gcc-build.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-dpls-phy6252-gcc
          path: |
            tmp/gcc-build.log
            tmp/test-dpls-gcc.hex
            Firmware/targets/phy6252/build/test-dpls.elf
            Firmware/targets/phy6252/build/test-dpls.map
          if-no-files-found: error
