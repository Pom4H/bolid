name: PHY6252 AC6 target build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Firmware/**"
      - "tools/build_firmware.sh"
      - "tools/fetch_phy6252_sdk.sh"
      - ".github/workflows/firmware-target.yml"
  push:
    branches: [main]
    paths:
      - "Firmware/**"
      - "tools/build_firmware.sh"
      - "tools/fetch_phy6252_sdk.sh"
      - ".github/workflows/firmware-target.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-ac6:
    name: Build PHY6252 firmware with AC6
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5

      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh

      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: Firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-ac6-${{ hashFiles('Firmware/targets/phy6252/vcpkg-configuration.json') }}

      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build ADC-enabled firmware
        shell: bash
        env:
          DPLS_ADC: "1"
        run: |
          set -o pipefail
          mkdir -p tmp
          bash tools/build_firmware.sh tmp/test-dpls-sdk-3.1.2.hex 2>&1 | tee tmp/ac6-build-adc.log
          cp Firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/test-dpls-sdk-3.1.2.axf
          cp Firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/test-dpls-sdk-3.1.2.map

      - name: Build ADC-disabled firmware
        shell: bash
        env:
          DPLS_ADC: "0"
        run: |
          set -o pipefail
          bash tools/build_firmware.sh tmp/test-dpls-adcoff.hex 2>&1 | tee tmp/ac6-build-noadc.log
          cp Firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf tmp/test-dpls-adcoff.axf
          cp Firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map tmp/test-dpls-adcoff.map

      - name: Upload target artifacts and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dpls-phy6252-sdk-3.1.2
          path: |
            tmp/ac6-build-adc.log
            tmp/ac6-build-noadc.log
            tmp/test-dpls-sdk-3.1.2.hex
            tmp/test-dpls-sdk-3.1.2.axf
            tmp/test-dpls-sdk-3.1.2.map
            tmp/test-dpls-adcoff.hex
            tmp/test-dpls-adcoff.axf
            tmp/test-dpls-adcoff.map
          if-no-files-found: error
