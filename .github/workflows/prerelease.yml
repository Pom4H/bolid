name: Build v1.1.3-rc.1 pre-release

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.1.3-rc.1

permissions:
  contents: write

concurrency:
  group: prerelease-v1.1.3-rc.1
  cancel-in-progress: true

env:
  RELEASE_TAG: v1.1.3-rc.1

jobs:
  firmware:
    name: Build four-channel ADC firmware
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install AC6 runtime dependencies
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.9 libtinfo5

      - name: Fetch pinned PHY62XX SDK 3.1.2
        run: bash tools/fetch_phy6252_sdk.sh

      - name: Activate CMSIS Toolbox and Arm Compiler 6
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: Firmware/targets/phy6252/vcpkg-configuration.json
          cache: phy6252-ac6-${{ hashFiles('Firmware/targets/phy6252/vcpkg-configuration.json') }}

      - name: Activate Arm Community license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Verify target pinout
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#define DPLS_PIN_PORT1_ADC GPIO_P20' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT2_ADC GPIO_P15' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_PORT_T_ADC GPIO_P24' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_VCAP_ADC GPIO_P23' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_RED GPIO_P07' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_GREEN GPIO_P11' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_LED_BLUE GPIO_P18' Firmware/phy6252/dpls_board.h
          grep -q '#define DPLS_PIN_FACTORY_RESET GPIO_P34' Firmware/phy6252/dpls_board.h
          grep -q 'ADC_CH2N_P24' Firmware/phy6252/dpls_phy6252_app.c
          ! grep -q 'ADC_CH1N_P11' Firmware/phy6252/dpls_phy6252_app.c

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bash tools/build_firmware.sh out/test-dpls-fw-1.1.3-rc.1-adc.hex 2>&1 | tee out/firmware-build.log
          cp Firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf out/test-dpls-fw-1.1.3-rc.1.axf
          cp Firmware/targets/phy6252/out/test-dpls/*/test-dpls.axf.map out/test-dpls-fw-1.1.3-rc.1.map

      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-firmware
          if-no-files-found: error
          path: out/

  android:
    name: Build minified Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build minified release only
        working-directory: TestDPLS
        run: ./gradlew --no-daemon clean testReleaseUnitTest lintRelease assembleRelease bundleRelease

      - name: Verify and collect release packages
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 5' TestDPLS/app/build.gradle.kts
          grep -q 'versionName = "1.1.2"' TestDPLS/app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' TestDPLS/app/build.gradle.kts
          grep -q 'isShrinkResources = true' TestDPLS/app/build.gradle.kts
          mkdir -p out
          apk="$(find TestDPLS/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find TestDPLS/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk" && test -f "$apk"
          test -n "$aab" && test -f "$aab"
          cp "$apk" out/test-dpls-app-1.1.2-rc.1-minified-unsigned.apk
          cp "$aab" out/test-dpls-app-1.1.2-rc.1-minified-unsigned.aab
          find TestDPLS/app/build/outputs/mapping/release -maxdepth 1 -type f -exec cp {} out/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-android-minified
          if-no-files-found: error
          path: out/

  publish:
    name: Publish GitHub pre-release
    needs: [firmware, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: prerelease-firmware
          path: dist/firmware

      - uses: actions/download-artifact@v4
        with:
          name: prerelease-android-minified
          path: dist/android

      - name: Generate interactive documentation from firmware sources
        run: python3 tools/generate_behavior_sim.py --output dist/release/test-dpls-behavior-sim-1.1.3-rc.1.html

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release dist/docs
          cp dist/firmware/* dist/release/
          cp dist/android/* dist/release/
          cp dist/release/test-dpls-behavior-sim-1.1.3-rc.1.html dist/docs/index.html
          cp docs/bring-up-checklist.md dist/docs/
          cp docs/android-operator-guide.md dist/docs/
          cp docs/android-pmi.md dist/docs/
          cp docs/android-compliance.md dist/docs/
          cp docs/oss-register.md dist/docs/
          cp docs/live-voltage-requirements.md dist/docs/
          cp TestDPLS/BUILD.md dist/docs/android-build.md
          (cd dist/docs && zip -r ../release/test-dpls-documentation-1.1.3-rc.1.zip .)
          (cd dist/release && sha256sum * > SHA256SUMS.txt)
          cat > dist/release-notes.md <<'EOF'
          # Тест-ДПЛС v1.1.3-rc.1

          Предварительная сборка из ветки `release/v1.1.3-rc.1`.

          ## Главное

          - PHY6252 последовательно измеряет четыре физических канала один раз в секунду: +1 на P20, +2 на P15, +Т на P24 и резерв на P23;
          - внешний ADC и внешний аналоговый мультиплексор не требуются;
          - для +1/+2/+Т нужны три отдельных входных делителя и защиты 0-30 В на плате hardware revision 2;
          - STATE_REPORT передаёт четыре независимых значения с отдельными validity-флагами; подстановка одного канала в другой запрещена;
          - приложение обновляет показания во всех режимах, включая «Норма»;
          - RGB-индикация сохранена: P7 — красный, P11 — зелёный, P18 — синий; идентификация выполняется зелёными вспышками;
          - P24 отдан под ADC клеммы +Т, поэтому физический сброс настроек перенесён на P34;
          - KZ_1 остаётся на P14; P15 используется только как ADC клеммы +2;
          - общий raw-буфер сохраняет SRAM при четырёхканальном опросе;
          - Android version 1.1.2, versionCode 5, только minified release без debug-сборки.

          ## Артефакты

          - `test-dpls-fw-1.1.3-rc.1-adc.hex` — прошивка для hardware revision 2;
          - `test-dpls-app-1.1.2-rc.1-minified-unsigned.apk` — minified release APK;
          - `test-dpls-app-1.1.2-rc.1-minified-unsigned.aab` — minified release AAB;
          - `test-dpls-behavior-sim-1.1.3-rc.1.html` — сгенерированная интерактивная документация;
          - `test-dpls-documentation-1.1.3-rc.1.zip` — документация и требования к live-телеметрии;
          - `mapping.txt` — карта R8/ProGuard;
          - `SHA256SUMS.txt` — контрольные суммы.

          APK/AAB не подписаны production-ключом: ключ не хранится в репозитории.
          EOF

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Тест-ДПЛС v1.1.3-rc.1" --notes-file dist/release-notes.md --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --title "Тест-ДПЛС v1.1.3-rc.1" --notes-file dist/release-notes.md --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
