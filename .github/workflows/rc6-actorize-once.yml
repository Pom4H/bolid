name: RC6 actorize once

on:
  push:
    branches:
      - release/1.4.2-rc6

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[rc6-migrated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/1.4.2-rc6
          fetch-depth: 1
      - name: Apply exact RC6 migration
        run: python3 tools/rc6_actorize_client.py
      - name: Commit exact migration
        run: |
          set -euo pipefail
          paths=(
            mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsClient.kt
            mobile/core/src/androidMain/kotlin/ru/bolid/testdpls/core/app/AndroidBleTransport.kt
            tools/architecture_guard.py
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "migration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "rc6: apply deterministic actor migration [rc6-migrated]"
          git push origin HEAD:release/1.4.2-rc6
