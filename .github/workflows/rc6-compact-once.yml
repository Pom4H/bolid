name: RC6 compact once

on:
  push:
    branches:
      - release/1.4.2-rc6

permissions:
  contents: write

jobs:
  compact:
    if: ${{ !contains(github.event.head_commit.message, '[rc6-compact]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/1.4.2-rc6
          fetch-depth: 1
      - name: Apply compact RC6 migration
        run: python3 tools/rc6_compact.py
      - name: Commit compact production diff and remove scaffolding
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            mobile/core/src/androidMain/kotlin/ru/bolid/testdpls/core/app/AndroidBleTransport.kt \
            mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsWire.kt \
            firmware/phy6252/dpls_phy6252_snv_guard.c \
            tools/test_ble_timeout_contract.py \
            tools/test_phy6252_snv_guard_contract.py \
            tools/architecture_guard.py
          git rm --ignore-unmatch -- \
            mobile/core/src/commonTest/kotlin/ru/bolid/testdpls/core/app/DplsWireTest.kt \
            tools/rc6_compact.py \
            .github/workflows/rc6-compact-once.yml
          git commit -m "rc6: compact connection and flash ownership [rc6-compact]"
          git push origin HEAD:release/1.4.2-rc6
