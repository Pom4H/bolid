name: Apply RC9 mobile timing patch

on:
  push:
    branches:
      - fix/rc9-identify-journal-reserve
    paths:
      - .github/workflows/zz-patch-rc9-mobile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rc9-identify-journal-reserve

      - name: Patch identify timing and its regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client_path = Path("mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsClient.kt")
          client = client_path.read_text()
          old = '''        if (identify.afterConnect) {
              val sequence = request(DplsProtocol.Type.IDENTIFY_START) ?: return
              identify = Identify(
                  responseSequence = sequence,
                  sentAtMillis = platform.nowMillis(),
              )
              updateState { it.copy(statusText = "Показать на объекте…", awaitingUserPassword = false) }
          } else {'''
          new = '''        if (identify.afterConnect) {
              /* Start RTT accounting before frame encoding/queueing. The physical LED
               * starts after the outbound ATT leg reaches the device, so sampling the
               * clock after request() systematically made the phone LED lag behind. */
              val sentAtMillis = platform.nowMillis()
              val sequence = request(DplsProtocol.Type.IDENTIFY_START) ?: return
              identify = Identify(
                  responseSequence = sequence,
                  sentAtMillis = sentAtMillis,
              )
              updateState { it.copy(statusText = "Показать на объекте…", awaitingUserPassword = false) }
          } else {'''
          if old not in client:
              raise SystemExit("identify onSubscribed block not found")
          client = client.replace(old, new, 1)

          old = '''    override fun requestMode(mode: DplsMode) {
              val controlsReady = session is DeviceSession.Online &&
                  state.state != null &&
                  !state.commandInProgress
              if (controlsReady && (operation == null || mode == DplsMode.NORMAL)) {
                  updateState { it.copy(pendingMode = mode) }
              }
          }'''
          new = '''    override fun requestMode(mode: DplsMode) {
              /* UI disables dangerous tests on low reserve, but keep the same safety
               * invariant at the command boundary for non-UI callers as well. */
              if (mode.dangerous && state.state?.reserveLow == true) return
              val controlsReady = session is DeviceSession.Online &&
                  state.state != null &&
                  !state.commandInProgress
              if (controlsReady && (operation == null || mode == DplsMode.NORMAL)) {
                  updateState { it.copy(pendingMode = mode) }
              }
          }'''
          if old not in client:
              raise SystemExit("requestMode block not found")
          client_path.write_text(client.replace(old, new, 1))

          test_path = Path("mobile/core/src/commonTest/kotlin/ru/bolid/testdpls/core/app/DplsClientV2Test.kt")
          test = test_path.read_text()
          old = '''        client.identify("ble-1")
              transport.connected()
              transport.subscribed()
              val identify = transport.lastFrame()
              assertFalse(client.uiState.value.identifyLedLive)
              platform.now = 100_080
              transport.reply(DplsProtocol.Type.IDENTIFY_START, byteArrayOf(), identify.sequence)
              assertTrue(client.uiState.value.identifyLedLive)'''
          new = '''        client.identify("ble-1")
              transport.connected()
              /* Simulate 10 ms spent encoding/queueing the ATT write. RTT must start
               * before that work, otherwise the preview is late by half the omitted time. */
              transport.onSend = { platform.now += 10 }
              transport.subscribed()
              transport.onSend = null
              val identify = transport.lastFrame()
              assertFalse(client.uiState.value.identifyLedLive)
              platform.now = 100_090
              transport.reply(DplsProtocol.Type.IDENTIFY_START, byteArrayOf(), identify.sequence)
              assertTrue(client.uiState.value.identifyLedLive)
              assertEquals(45L, client.uiState.value.identifyLedPhaseOffsetMs)'''
          if old not in test:
              raise SystemExit("identify regression test block not found")
          test = test.replace(old, new, 1)

          old = '''        var nextRssi = -40

              override fun setListener(listener: DplsTransportListener) {'''
          new = '''        var nextRssi = -40
              var onSend: (() -> Unit)? = null

              override fun setListener(listener: DplsTransportListener) {'''
          if old not in test:
              raise SystemExit("FakeTransport fields block not found")
          test = test.replace(old, new, 1)

          old = '''        override fun send(bytes: ByteArray, priority: Boolean, flush: Boolean): Boolean {
                  if (flush) writes.clear()
                  writes += bytes.copyOf()
                  listener.onWriteComplete(null)
                  return true
              }'''
          new = '''        override fun send(bytes: ByteArray, priority: Boolean, flush: Boolean): Boolean {
                  if (flush) writes.clear()
                  writes += bytes.copyOf()
                  onSend?.invoke()
                  listener.onWriteComplete(null)
                  return true
              }'''
          if old not in test:
              raise SystemExit("FakeTransport send block not found")
          test_path.write_text(test.replace(old, new, 1))
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsClient.kt
          git add mobile/core/src/commonTest/kotlin/ru/bolid/testdpls/core/app/DplsClientV2Test.kt
          git rm .github/workflows/zz-patch-rc9-mobile.yml
          git commit -m "fix(mobile): align identify phase and guard low reserve"
          git push origin HEAD:fix/rc9-identify-journal-reserve
