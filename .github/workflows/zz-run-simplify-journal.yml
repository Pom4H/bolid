name: Run journal simplification

on:
  pull_request:
    branches:
      - release/1.4.2-rc9

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/rc9-identify-journal-reserve'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rc9-identify-journal-reserve
      - name: Apply single-clock journal model
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/simplify_journal_time.py
          git diff --check
          git rm \
            .github/workflows/zz-simplify-journal-time.yml \
            .github/workflows/zz-run-simplify-journal.yml \
            tools/simplify_journal_time.py
          git add firmware mobile docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(journal): use UTC or unknown timestamps"
          git push origin HEAD:fix/rc9-identify-journal-reserve
