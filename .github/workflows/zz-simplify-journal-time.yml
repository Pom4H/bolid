name: Apply journal single-clock simplification

on:
  push:
    branches:
      - fix/rc9-identify-journal-reserve
    paths:
      - .github/workflows/zz-simplify-journal-time.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rc9-identify-journal-reserve
      - name: Replace mixed uptime/UTC journal model with UTC-or-unknown
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new)

          # Firmware journal timestamp has one meaning: Unix UTC. Zero means unknown.
          p = "firmware/src/dpls_server.c"
          s = read(p)
          s = replace_once(
              s,
              "static uint32_t event_timestamp_seconds(const dpls_server_t *s) {\n    return s->clock.valid ? s->clock.unix_seconds : s->now_ms / 1000u;\n}",
              "static uint32_t event_timestamp_seconds(const dpls_server_t *s) {\n    return s->clock.valid ? s->clock.unix_seconds : 0u;\n}",
              "firmware timestamp contract",
          )
          write(p, s)

          p = "firmware/include/dpls_server.h"
          s = read(p)
          s = replace_once(
              s,
              "    uint32_t timestamp_seconds;\n",
              "    /* 0 = calendar time unknown; otherwise Unix UTC seconds. */\n    uint32_t timestamp_seconds;\n",
              "event timestamp comment",
          )
          write(p, s)

          p = "firmware/tests/test_server_v2.c"
          s = read(p)
          s = replace_once(
              s,
              "    unsigned apply_count;\n\n    init_server(&fake, &server, true);\n    assert(server.safety.mode == DPLS_MODE_NORMAL && fake.normal);\n    authenticate(&server, &fake, buf);\n",
              "    unsigned apply_count;\n    uint16_t i;\n\n    init_server(&fake, &server, true);\n    assert(server.safety.mode == DPLS_MODE_NORMAL && fake.normal);\n    authenticate(&server, &fake, buf);\n    assert(fake.event_count >= 3u);\n    for (i = 0u; i < fake.event_count; ++i) {\n        assert(fake.events[i].timestamp_seconds == 0u);\n    }\n",
              "pre-sync firmware test",
          )
          s = replace_once(
              s,
              "    assert(r.type == DPLS_MSG_TIME_SYNC && r.sequence == 30u && r.payload_length == 0u);\n    assert(server.clock.valid);\n\n    auth_payload(&server, payload);\n",
              "    assert(r.type == DPLS_MSG_TIME_SYNC && r.sequence == 30u && r.payload_length == 0u);\n    assert(server.clock.valid);\n    dpls_server_log(&server, 12u, 0u);\n    assert(fake.events[fake.event_count - 1u].timestamp_seconds == 0x6a7c7780u);\n\n    auth_payload(&server, payload);\n",
              "post-sync firmware test",
          )
          write(p, s)

          # Remove mobile boot-epoch/anchor reconstruction state.
          p = "mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/domain/DeviceModel.kt"
          s = read(p)
          s = replace_once(
              s,
              "data class EventRecord(\n    val sequence: Long,\n    val timestampSeconds: Long,\n    val type: Int,\n    val parameter: Int,\n)\n\ndata class JournalTimeAnchor(\n    val bootFirstSequence: Long,\n    val bootEpochSeconds: Long,\n    val lastSequence: Long,\n)\n",
              "data class EventRecord(\n    val sequence: Long,\n    /** 0 means that UTC was unknown when firmware wrote the event. */\n    val timestampSeconds: Long,\n    val type: Int,\n    val parameter: Int,\n)\n",
              "domain time model",
          )
          write(p, s)

          p = "mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/domain/AppState.kt"
          s = read(p)
          s = replace_once(s, "    val deviceBootEpochSeconds: Long? = null,\n", "", "boot epoch state")
          s = replace_once(s, "    val journalTimeAnchors: List<JournalTimeAnchor> = emptyList(),\n", "", "anchor state")
          write(p, s)

          p = "mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/DplsController.kt"
          s = read(p)
          s = replace_once(s, "    fun formatEventInstant(uptimeSeconds: Long): String\n", "", "obsolete formatter")
          write(p, s)

          write(
              "mobile/core/src/commonMain/kotlin/ru/bolid/testdpls/core/app/EventTime.kt",
              '''package ru.bolid.testdpls.core.app

import ru.bolid.testdpls.core.protocol.DplsProtocol

internal fun eventTimestampBasis(timestampSeconds: Long): String =
    if (timestampSeconds in DplsProtocol.TIME_MIN_UNIX_SECONDS..DplsProtocol.TIME_MAX_UNIX_SECONDS) "utc" else "unknown"

internal fun eventTimestampText(timestampSeconds: Long): String =
    if (eventTimestampBasis(timestampSeconds) == "utc") formatUnixUtc(timestampSeconds)
    else "Время не установлено"

/* Gregorian conversion adapted from the civil-from-days algorithm. Keeping it
 * in commonMain avoids platform date APIs and guarantees identical Android/iOS
 * journal exports. The accepted protocol range is positive Unix time. */
private fun formatUnixUtc(seconds: Long): String {
    val days = seconds / 86_400L
    val secondOfDay = seconds % 86_400L
    var z = days + 719_468L
    val era = z / 146_097L
    val dayOfEra = z - era * 146_097L
    val yearOfEra = (dayOfEra - dayOfEra / 1_460L + dayOfEra / 36_524L - dayOfEra / 146_096L) / 365L
    var year = yearOfEra + era * 400L
    val dayOfYear = dayOfEra - (365L * yearOfEra + yearOfEra / 4L - yearOfEra / 100L)
    val monthPrime = (5L * dayOfYear + 2L) / 153L
    val day = dayOfYear - (153L * monthPrime + 2L) / 5L + 1L
    val month = monthPrime + if (monthPrime < 10L) 3L else -9L
    if (month <= 2L) year += 1L

    val hour = secondOfDay / 3_600L
    val minute = (secondOfDay % 3_600L) / 60L
    val second = secondOfDay % 60L
    fun two(value: Long): String = value.toString().padStart(2, '0')
    return "${year.toString().padStart(4, '0')}-${two(month)}-${two(day)} ${two(hour)}:${two(minute)}:${two(second)} UTC"
}
'''
