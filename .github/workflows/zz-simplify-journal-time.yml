          write("docs/timekeeping.md", '''# Время и отметки событий

Test-DPLS разделяет монотонное время для safety/deadlines и календарное UTC для журнала.

## Монотонное время

Интеграция PHY6252 получает миллисекунды из `osal_GetSystemClock()`. Это время используется только для внутренних интервалов: таймаутов опасного режима, сессии, identify, удержания factory reset и BLE TX.

Синхронизация календарного времени не влияет на эти интервалы.

## UTC для журнала

После успешной application-аутентификации мобильный клиент отправляет `TIME_SYNC (0x0B)` с `unix_utc`. Firmware принимает только диапазон 2020-01-01…2099-12-31. UTC anchor живёт в RAM и продвигается монотонным счётчиком.

У `timestamp_seconds` ровно один смысл:

- `0` — календарное время события неизвестно;
- значение в поддерживаемом диапазоне — Unix UTC.

До первого `TIME_SYNC` после boot firmware пишет `0`, а не uptime. После `TIME_SYNC` новые события получают Unix UTC. После полного снятия питания UTC снова неизвестен до следующего подключения телефона.

Приложение не реконструирует календарные даты из uptime, boot epoch или соседних записей. Старые записи предыдущих RC с относительными timestamp тоже показываются как `Время не установлено`.

Порядок событий всегда определяется `sequence`. CSV export использует `time_basis=utc` или `time_basis=unknown`.
''')

