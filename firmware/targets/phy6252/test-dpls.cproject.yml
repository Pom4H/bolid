project:
  packs:
    - pack: ARM::CMSIS@^5.0.0
    - pack: ARM::CMSIS-NN@^4.0.0
    - pack: ARM::CMSIS-DSP@^1.10.1

  setups:
    - setup: Options for Target_1
      processor:
        endian: little
      add-path:
        - source
        - ../../sdk/PHY62XX_SDK_3.1.2/example/ble_peripheral/simpleBlePeripheral/source
        - ../../sdk/PHY62XX_SDK_3.1.2/components/inc
        - ../../sdk/PHY62XX_SDK_3.1.2/components/ble/controller
        - ../../sdk/PHY62XX_SDK_3.1.2/components/osal/include
        - ../../sdk/PHY62XX_SDK_3.1.2/components/common
        - ../../sdk/PHY62XX_SDK_3.1.2/components/ble/include
        - ../../sdk/PHY62XX_SDK_3.1.2/components/ble/hci
        - ../../sdk/PHY62XX_SDK_3.1.2/components/ble/host
        - ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/ota_app
        - ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/DevInfo
        - ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/SimpleProfile
        - ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/Roles
        - ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/GATT
        - ../../sdk/PHY62XX_SDK_3.1.2/components/libraries/crc16
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/watchdog
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/clock
        - ../../sdk/PHY62XX_SDK_3.1.2/components/arch/cm0
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/pwrmgr
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/uart
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/gpio
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/adc
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/timer
        - ../../sdk/PHY62XX_SDK_3.1.2/misc
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/log
        - ../../sdk/PHY62XX_SDK_3.1.2/components/libraries/cliface
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/key
        - ../../sdk/PHY62XX_SDK_3.1.2/components/driver/flash
        - ../../sdk/PHY62XX_SDK_3.1.2/components/libraries/fs
        - ../../sdk/PHY62XX_SDK_3.1.2/components/libraries/tinycrypt-0.2.8/lib/include
        - ../../include
        - ../../phy6252
      debug: "on"
      define:
        - CFG_CP
        - OSAL_CBTIMER_NUM_TASKS: "1"
        - MTU_SIZE: "247"
        - HOST_CONFIG: "4"
        - HCI_TL_NONE: "1"
        - ENABLE_LOG_ROM_: "0"
        - _BUILD_FOR_DTM_: "0"
        # Production/current-measurement build: SDK LOG() compiles to nothing.
        - DEBUG_INFO: "0"
        - DPLS_CONNECTED_SLEEP: "1"
        - DPLS_DEBUG_UART_ROM: "0"
        - DPLS_POWER_DIAG_LOG: "0"
        - DBG_ROM_MAIN: "0"
        - APP_CFG: "0"
        - OSALMEM_METRICS: "0"
        - PHY_MCU_TYPE: MCU_BUMBEE_M0
        - CFG_SLEEP_MODE: PWR_MODE_SLEEP
        - CFG_SRAM_RETENTION_LOW_CURRENT_LDO_ENABLE
        - CFG_HCLK_DYNAMIC_CHANGE: "0"
        - DEF_GAPBOND_MGR_ENABLE: "1"
        - USE_FS: "1"
        - MAX_NUM_LL_CONN: "1"
        - GATT_MAX_NUM_CONN: MAX_NUM_LL_CONN+1
        - DPLS_EVENT_CAPACITY: "200"
        - __MICROLIB
      define-asm:
        - __MICROLIB
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wall
            - -Wextra
            - -Wno-packed
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
            - -DADV_NCONN_CFG=0x01 -DADV_CONN_CFG=0x02 -DSCAN_CFG=0x04 -DINIT_CFG=0x08 -DBROADCASTER_CFG=0x01 -DOBSERVER_CFG=0x02 -DPERIPHERAL_CFG=0x04 -DCENTRAL_CFG=0x08
          CPP:
            - -xc++
            - -std=c++98
            - -fno-exceptions
          ASM:
            - -masm=auto
            - -Wno-unused-command-line-argument
            - -Wa,--diag_suppress=1950
          Link:
            - --library_type=microlib
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - ../../sdk/PHY62XX_SDK_3.1.2/misc/bb_rom_sym_m0.txt
            - --keep=jump_table_base
            - --keep=global_config
            - --summary_stderr
            - --info summarysizes

  linker:
    - script: scatter_load.sct

  groups:
    - group: arch
      warnings: off
      misc:
        - C-CPP:
            - -w
      files:
        - file: ../../sdk/PHY62XX_SDK_3.1.2/example/ble_peripheral/simpleBlePeripheral/main.c

    - group: driver
      warnings: off
      misc:
        - C-CPP:
            - -w
      files:
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/uart/uart.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/clock/clock.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/gpio/gpio.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/adc/adc.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/timer/timer.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/watchdog/watchdog.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/pwrmgr/pwrmgr.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/log/my_printf.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/osal/snv/osal_snv.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/libraries/fs/fs.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/driver/flash/flash.c

    - group: profile
      warnings: off
      misc:
        - C-CPP:
            - -w
      files:
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/Roles/gap.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/Roles/gapbondmgr.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/Roles/gapgattserver.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/Roles/peripheral.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/profiles/GATT/gattservapp.c

    - group: jump
      warnings: off
      misc:
        - C-CPP:
            - -w
      files:
        - file: ../../sdk/PHY62XX_SDK_3.1.2/misc/jump_table.c

    - group: lib
      files:
        - file: ../../sdk/PHY62XX_SDK_3.1.2/lib/rf.lib
        - file: ../../sdk/PHY62XX_SDK_3.1.2/lib/ble_host.lib

    - group: application
      warnings: off
      misc:
        - C-CPP:
            - -w
      files:
        - file: ../../sdk/PHY62XX_SDK_3.1.2/example/ble_peripheral/simpleBlePeripheral/source/OSAL_SimpleBLEPeripheral.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/example/ble_peripheral/simpleBlePeripheral/source/SimpleBLEPeripheral_Main.c

    - group: tinycrypt
      warnings: off
      misc:
        - C-CPP:
            - -w
      files:
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/libraries/tinycrypt-0.2.8/lib/source/hmac.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/libraries/tinycrypt-0.2.8/lib/source/sha256.c
        - file: ../../sdk/PHY62XX_SDK_3.1.2/components/libraries/tinycrypt-0.2.8/lib/source/utils.c

    - group: dpls
      warnings: all
      misc:
        - C-CPP:
            - -Werror
      files:
        - file: source/dplsBLEPeripheral.c
        - file: ../../src/dpls_protocol.c
        - file: ../../src/dpls_server.c
        - file: ../../src/dpls_safety.c
        - file: ../../src/dpls_led.c
        - file: ../../src/dpls_calib.c
        - file: ../../src/dpls_durable_settings.c
        - file: ../../phy6252/dpls_gatt_service.c
        - file: ../../phy6252/dpls_ble_identity.c
        - file: ../../phy6252/dpls_phy6252_auth.c
        - file: ../../phy6252/dpls_phy6252_measurements.c
        - file: ../../phy6252/dpls_phy6252_outputs.c
        - file: ../../phy6252/dpls_phy6252_power.c
        - file: ../../phy6252/dpls_phy6252_runtime.c
        - file: ../../phy6252/dpls_phy6252_storage.c
        - file: ../../phy6252/dpls_phy6252_supervisor.c
        - file: ../../phy6252/dpls_phy6252_transport.c

  components:
    - component: ARM::CMSIS:CORE
      warnings: off
    - component: ARM::Device:Startup
      warnings: off
      misc:
        - C-CPP:
            - -w
          ASM:
            - -masm=auto
            - -Wno-unused-command-line-argument
            - -Wa,--diag_suppress=1950
