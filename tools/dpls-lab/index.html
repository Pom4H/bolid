<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test-DPLS lab</title>
    <style>
      :root {
        --navy: #0b0e10;
        --surface: #141a1e;
        --raised: #1c242a;
        --line: #2a343c;
        --blue: #0072bc;
        --cyan: #00ccff;
        --text: #f4f6f7;
        --muted: #8e9396;
        --ok: #34c759;
        --warn: #ff8a3d;
        --fault: #d45252;
        --led: #00f540;
      }
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--text); font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
      .lab {
        display: grid;
        height: 100%;
        min-height: 0;
        grid-template-columns: minmax(260px, 1.15fr) minmax(260px, 1fr) minmax(340px, 0.95fr);
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        grid-template-areas:
          "status status status"
          "roster roster roster"
          "board firmware phone"
          "cmd cmd cmd";
      }
      .status {
        grid-area: status;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 6px 14px;
        border-bottom: 1px solid var(--line);
        background: #101418;
        font-size: 12px;
      }
      .status-name { font-size: 13px; margin-right: 4px; }
      .status-time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
      }
      .pill.ok { color: var(--ok); border-color: #2a5a38; }
      .pill.warn { color: var(--warn); border-color: var(--warn); }
      .roster {
        grid-area: roster;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        background: #0e1215;
        min-width: 0;
      }
      .roster-list { display: flex; gap: 6px; flex: 1; min-width: 0; overflow: auto; }
      .roster-item {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 5px 8px;
        border-radius: 10px;
        white-space: nowrap;
      }
      .roster-name { font-size: 12px; font-weight: 650; }
      .roster-meta { font-size: 11px; color: var(--muted); }
      .roster-x { color: var(--muted); padding: 0 4px; }
      .roster-x:hover { color: var(--fault); }
      .roster-fw { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; flex-shrink: 0; }
      .roster-fw select {
        margin: 0;
        padding: 5px 8px;
        font: 12px ui-monospace, Menlo, monospace;
        background: var(--navy);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .roster-err { color: var(--fault); font-size: 12px; }
      .cmdbar {
        grid-area: cmd;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-top: 1px solid var(--line);
        background: #101418;
      }
      .cmd-prompt { color: var(--cyan); font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .cmd-input {
        flex: 1;
        min-width: 0;
        width: auto;
        margin: 0;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--navy);
        color: var(--text);
        font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .pane { padding: 10px 14px; overflow: hidden; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
      .board { grid-area: board; border-right: 1px solid var(--line); }
      .firmware { grid-area: firmware; border-right: 1px solid var(--line); }
      .phone { grid-area: phone; background: #07090b; padding-top: 10px; }
      .eyebrow { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan); flex-shrink: 0; }
      .muted { color: var(--muted); font-size: 13px; }
      .board-canvas { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
      .kit-svg { width: 100%; height: 100%; max-height: 100%; display: block; }
      .board-dock { flex-shrink: 0; padding-top: 8px; }
      .volts-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
      .vchip { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
      .vchip.warn { border-color: var(--warn); }
      .vchip-k { display: block; color: var(--muted); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
      .vchip-v { display: block; font-size: 14px; font-weight: 650; margin-top: 2px; }
      .stand { display: flex; flex-wrap: wrap; gap: 8px; }
      .stand-radio, .stand-faults { display: flex; gap: 6px; flex-wrap: wrap; }
      .stand-radio { padding: 2px; border: 1px solid var(--line); border-radius: 12px; background: #0e1215; }
      .rgb-lens.on { filter: url(#ledglow); }
      .rgb-lens.identify { animation: identifyBlink 1s steps(2, end) infinite; filter: url(#ledglow); }
      @keyframes identifyBlink { 50% { opacity: 0.15; } }
      .fw-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-shrink: 0; }
      .fw-osal { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
      .radio-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        font-size: 12px;
        padding: 6px 0 4px;
        flex-shrink: 0;
      }
      .att-mini { flex-shrink: 0; }
      .ticks { display: flex; align-items: flex-end; gap: 2px; height: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; margin: 4px 0 8px; flex-shrink: 0; }
      .tick { width: 4px; height: 40%; background: #2a343c; border-radius: 2px; }
      .tick.lit { background: var(--ok); height: 70%; }
      .tick.busy { background: var(--cyan); height: 100%; }
      .slots { display: flex; gap: 4px; margin: 2px 0 4px; }
      .slot { width: 16px; height: 10px; border-radius: 2px; background: #1a1f23; border: 1px solid var(--line); }
      .slot.filled { background: var(--blue); }
      .slot.fly { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
      .pace { height: 4px; background: #1a1f23; border-radius: 99px; overflow: hidden; }
      .pace-bar { height: 100%; background: var(--cyan); }
      .fw-log {
        flex: 1;
        min-height: 0;
        margin: 0;
        overflow: auto;
        background: #0a0c0e;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        white-space: pre-wrap;
      }
      .log-cmd { color: var(--text); }
      .log-tx { color: var(--cyan); }
      .log-journal, .log-mode, .log-led { color: var(--warn); }
      .log-err { color: var(--fault); }
      .log-state { color: var(--ok); }
      button { background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: 12px; }
      button.on, button.primary { background: var(--blue); border-color: var(--blue); }
      button.on.danger { background: var(--fault); border-color: var(--fault); }
      button.ghost { background: transparent; }
      .phone-hint { margin: 0 20px 8px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
      .phone-hint strong { color: var(--text); }
      .phone-shell { width: min(420px, 100%); min-width: 280px; margin: 0 auto 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; position: relative; display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .phone-frame { border: 0; width: 100%; height: 100%; min-height: 480px; flex: 1; background: #0b0e10; display: block; }
      .warn { color: var(--warn); }
      .ok { color: var(--ok); }
      .toggle { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
      .phone .eyebrow { padding: 0 20px; }
      @media (max-width: 1180px) {
        .lab {
          grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.95fr);
          grid-template-rows: auto auto minmax(0, 1fr) minmax(0, 1fr) auto;
          grid-template-areas:
            "status status"
            "roster roster"
            "board phone"
            "firmware phone"
            "cmd cmd";
        }
        .firmware { border-right: 0; border-top: 1px solid var(--line); }
      }
      @media (max-width: 760px) {
        html, body, #root { height: auto; min-height: 100%; overflow: auto; }
        .lab {
          height: auto;
          width: 100%;
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto;
          grid-template-areas:
            "status"
            "roster"
            "board"
            "firmware"
            "phone"
            "cmd";
        }
        .board, .firmware { border-right: 0; border-bottom: 1px solid var(--line); }
        .firmware { border-top: 0; }
        .board { min-height: 70dvh; }
        .firmware { min-height: 50dvh; }
        .fw-log { min-height: 220px; }
        .phone { min-height: 100dvh; }
        .phone-shell { min-height: 640px; }
        .cmdbar { flex-wrap: wrap; position: sticky; bottom: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
